<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradKalinga" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0B1A28" />
      <stop offset="50%" stop-color="#07101B" />
      <stop offset="100%" stop-color="#04090D" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="75%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="mysticGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowKalinga">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="900" fill="url(#bgGradKalinga)" />

  <!-- Mystic Glow -->
  <circle cx="300" cy="360" r="230" fill="url(#mysticGrad)" filter="url(#glowKalinga)" opacity="0.4" />

  <!-- Ancient Temple / Wheel Emblem -->
  <g transform="translate(300, 330)" stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.7">
    <circle r="130" stroke-dasharray="2 6" stroke="#0284C7" />
    <circle r="105" />
    <circle r="75" stroke-dasharray="8 4" />
    <!-- 8 Spokes of Historical Wheel -->
    <line x1="0" y1="-105" x2="0" y2="105" />
    <line x1="-105" y1="0" x2="105" y2="0" />
    <line x1="-74" y1="-74" x2="74" y2="74" />
    <line x1="-74" y1="74" x2="74" y2="-74" />
    <circle r="25" fill="#07101B" stroke="#38BDF8" stroke-width="2" />
  </g>

  <!-- Top Badge -->
  <text x="300" y="80" text-anchor="middle" fill="#94A3B8" font-family="'Cinzel', serif, Georgia" font-size="12" letter-spacing="6" font-weight="600">HISTORICAL MYSTERY &amp; PAN-INDIA RIGHTS</text>
  <line x1="160" y1="95" x2="440" y2="95" stroke="#38BDF8" stroke-width="1" opacity="0.4" />

  <!-- Title -->
  <text x="300" y="500" text-anchor="middle" fill="url(#cyanGrad)" font-family="'Cinzel', serif, Georgia" font-size="38" font-weight="900" letter-spacing="8" filter="url(#glowKalinga)">SECRET OF KALINGA</text>
  
  <!-- Subtitle -->
  <text x="300" y="545" text-anchor="middle" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" letter-spacing="4">ANCIENT HERITAGE. UNTOLD LEGENDS.</text>

  <!-- Divider -->
  <line x1="220" y1="580" x2="380" y2="580" stroke="#38BDF8" stroke-width="1.5" opacity="0.7" />

  <!-- Metadata Grid -->
  <text x="300" y="620" text-anchor="middle" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" letter-spacing="3">HISTORICAL THRILLER • MYSTERY • 2024</text>
  <text x="300" y="650" text-anchor="middle" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" letter-spacing="2" font-weight="600">PAN-INDIA MULTI-LINGUAL RELEASE</text>

  <!-- Representation Tag Box -->
  <rect x="100" y="720" width="400" height="60" rx="6" fill="#091219" stroke="#1E2E3D" stroke-width="1.5" />
  <rect x="100" y="720" width="4" height="60" rx="2" fill="#38BDF8" />
  <text x="120" y="745" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="2" font-weight="700">INDIARK REPRESENTATION</text>
  <text x="120" y="765" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Media Rights Advisory &amp; Pan-India OTT Representation</text>

  <!-- Bottom Branding -->
  <text x="300" y="845" text-anchor="middle" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="4">INDIARK ENTERTAINMENTS CATALOGUE</text>
</svg>
