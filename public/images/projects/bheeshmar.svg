<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="45%" stop-color="#090E17" />
      <stop offset="100%" stop-color="#05070B" />
    </radialGradient>
    <linearGradient id="azureText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="40%" stop-color="#BAE6FD" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="azureGlowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="900" fill="url(#bgGrad)" />

  <!-- Atmospheric Glow & Texture -->
  <circle cx="300" cy="380" r="220" fill="url(#azureGlowGrad)" filter="url(#glow)" opacity="0.3" />
  
  <!-- Geometric Crest / Monogram -->
  <g transform="translate(300, 340)" stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.65">
    <circle r="120" stroke-dasharray="4 6" />
    <circle r="90" />
    <polygon points="0,-100 86,50 -86,50" />
    <polygon points="0,100 -86,-50 86,-50" />
    <circle r="30" fill="#090E17" stroke="#38BDF8" stroke-width="2" />
  </g>

  <!-- Film Festival Laurels / Top Badges -->
  <text x="300" y="80" text-anchor="middle" fill="#94A3B8" font-family="'Cinzel', serif, Georgia" font-size="12" letter-spacing="6" font-weight="600">OFFICIAL SELECTION • GLOBAL MEDIA RIGHTS</text>
  <line x1="180" y1="95" x2="420" y2="95" stroke="#38BDF8" stroke-width="1" opacity="0.4" />

  <!-- Central Title -->
  <text x="300" y="520" text-anchor="middle" fill="url(#azureText)" font-family="'Cinzel', serif, Georgia" font-size="52" font-weight="900" letter-spacing="10" filter="url(#glow)">BHEESHMAR</text>
  
  <!-- Subtitle / Tagline -->
  <text x="300" y="565" text-anchor="middle" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="4">AN EPIC CANVAS OF LOYALTY &amp; POWER</text>

  <!-- Divider -->
  <line x1="220" y1="600" x2="380" y2="600" stroke="#38BDF8" stroke-width="1.5" opacity="0.7" />

  <!-- Metadata Grid -->
  <text x="300" y="640" text-anchor="middle" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" letter-spacing="3">FEATURE FILM • ACTION / DRAMA • 2024</text>
  <text x="300" y="670" text-anchor="middle" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" letter-spacing="2" font-weight="600">TAMIL / TELUGU / MULTI-LANGUAGE DUB</text>

  <!-- Representation Tag Box -->
  <rect x="100" y="740" width="400" height="60" rx="6" fill="#0D111A" stroke="#1E2638" stroke-width="1.5" />
  <rect x="100" y="740" width="4" height="60" rx="2" fill="#38BDF8" />
  <text x="120" y="765" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="2" font-weight="700">INDIARK REPRESENTATION</text>
  <text x="120" y="785" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Exclusive Global OTT &amp; Digital Media Rights</text>

  <!-- Bottom Branding -->
  <text x="300" y="855" text-anchor="middle" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="4">INDIARK ENTERTAINMENTS CATALOGUE</text>
</svg>
